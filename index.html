<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Habit Tracker</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23570df8'%3E%3Cpath d='M9 11l3 3L22 4v4l-10 10-5-5-4 4V3h4z'/%3E%3C/svg%3E" />
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet" />
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  .day-dot { transition: all .15s; }
  .day-dot:hover { transform: scale(1.15); }
  .habit-row { transition: opacity .2s; }
</style>
</head>
<body class="min-h-screen bg-base-200 transition-colors">

<!-- Navbar -->
<div class="navbar bg-base-100 shadow-sm sticky top-0 z-20">
  <div class="flex-1 gap-2 px-4">
    <i data-lucide="target" class="w-6 h-6 text-primary"></i>
    <span class="text-lg font-semibold">Habits</span>
  </div>
  <div class="flex-none px-4">
    <label class="swap swap-rotate btn btn-ghost btn-circle">
      <input id="themeToggle" type="checkbox" />
      <i data-lucide="sun" class="swap-off w-5 h-5"></i>
      <i data-lucide="moon" class="swap-on w-5 h-5"></i>
    </label>
  </div>
</div>

<main class="max-w-3xl mx-auto p-4 md:p-8">
  <!-- Add habit -->
  <form id="addForm" class="card bg-base-100 shadow-sm p-4 mb-6 flex flex-col sm:flex-row gap-3">
    <input id="habitName" type="text" placeholder="New habit (e.g. Read 20 pages)" required maxlength="60"
           class="input input-bordered flex-1" />
    <select id="habitColor" class="select select-bordered">
      <option value="primary">Primary</option>
      <option value="secondary">Secondary</option>
      <option value="accent">Accent</option>
      <option value="success">Success</option>
      <option value="warning">Warning</option>
      <option value="error">Error</option>
    </select>
    <button class="btn btn-primary gap-2">
      <i data-lucide="plus" class="w-4 h-4"></i> Add
    </button>
  </form>

  <!-- Habits list -->
  <div id="habitsList" class="flex flex-col gap-3"></div>
  <div id="emptyState" class="hidden text-center py-16">
    <i data-lucide="sparkles" class="w-14 h-14 mx-auto opacity-40 mb-3"></i>
    <p class="opacity-60">No habits yet. Start small and build consistency.</p>
  </div>
</main>

<script>
/* ---------- IndexedDB ---------- */
const DB_NAME = 'HabitTrackerDB';
let db, habits = [], logs = [];

function openDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, 1);
    r.onupgradeneeded = e => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains('habits')) d.createObjectStore('habits', { keyPath: 'id', autoIncrement: true });
      if (!d.objectStoreNames.contains('logs')) {
        const s = d.createObjectStore('logs', { keyPath: 'id', autoIncrement: true });
        s.createIndex('habitDate', ['habitId', 'date'], { unique: true });
      }
    };
    r.onsuccess = e => { db = e.target.result; res(); };
    r.onerror = e => rej(e.target.error);
  });
}
const tx = (store, mode='readonly') => db.transaction(store, mode).objectStore(store);
const all = store => new Promise(r => { const q = tx(store).getAll(); q.onsuccess = () => r(q.result); });
const add = (store, v) => new Promise(r => { const q = tx(store, 'readwrite').add(v); q.onsuccess = () => r(q.result); });
const del = (store, id) => new Promise(r => { const q = tx(store, 'readwrite').delete(id); q.onsuccess = () => r(); });
const getLog = (habitId, date) => new Promise(r => {
  const q = tx('logs').index('habitDate').get([habitId, date]);
  q.onsuccess = () => r(q.result);
});

/* ---------- Date helpers ---------- */
const today = () => new Date().toISOString().slice(0, 10);
const fmtDay = d => d.toLocaleDateString(undefined, { weekday: 'short' }).slice(0, 2);
function getLast7() {
  const arr = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date(); d.setDate(d.getDate() - i);
    arr.push({ date: d.toISOString().slice(0, 10), label: fmtDay(d), isToday: i === 0 });
  }
  return arr;
}

/* ---------- Streak calculation ---------- */
function calcStreak(logDates) {
  if (!logDates.length) return 0;
  const set = new Set(logDates);
  let streak = 0;
  // Start from today; if today not done, start from yesterday
  const d = new Date();
  if (!set.has(d.toISOString().slice(0, 10))) d.setDate(d.getDate() - 1);
  while (set.has(d.toISOString().slice(0, 10))) {
    streak++;
    d.setDate(d.getDate() - 1);
  }
  return streak;
}

/* ---------- Render ---------- */
const days = getLast7();

function render() {
  const list = document.getElementById('habitsList');
  const empty = document.getElementById('emptyState');
  if (!habits.length) { list.innerHTML = ''; empty.classList.remove('hidden'); lucide.createIcons(); return; }
  empty.classList.add('hidden');

  list.innerHTML = habits.map(h => {
    const hLogs = logs.filter(l => l.habitId === h.id);
    const logDates = hLogs.map(l => l.date);
    const streak = calcStreak(logDates);
    const doneDates = new Set(logDates);

    const dots = days.map(d => {
      const done = doneDates.has(d.date);
      const cls = done
        ? `bg-${h.color} text-${h.color}-content`
        : 'bg-base-300 hover:bg-base-300/70';
      const ring = d.isToday ? 'ring-2 ring-offset-2 ring-offset-base-100 ring-base-content/30' : '';
      return `
        <button class="day-dot w-9 h-9 rounded-lg ${cls} ${ring} flex items-center justify-center text-xs font-medium"
                data-habit="${h.id}" data-date="${d.date}" title="${d.date}">
          ${d.label}
        </button>`;
    }).join('');

    return `
    <div class="habit-row card bg-base-100 shadow-sm">
      <div class="card-body p-4">
        <div class="flex items-center justify-between gap-3 flex-wrap">
          <div class="flex items-center gap-3 min-w-0">
            <div class="w-2 h-10 rounded-full bg-${h.color}"></div>
            <div class="min-w-0">
              <h3 class="font-medium truncate">${escapeHtml(h.name)}</h3>
              <div class="flex items-center gap-1 text-sm ${streak > 0 ? 'text-warning' : 'opacity-50'}">
                <i data-lucide="flame" class="w-4 h-4"></i>
                <span>${streak} day${streak === 1 ? '' : 's'}</span>
              </div>
            </div>
          </div>
          <button class="btn btn-ghost btn-sm btn-circle text-error/70 hover:text-error" onclick="deleteHabit(${h.id})" title="Delete">
            <i data-lucide="trash-2" class="w-4 h-4"></i>
          </button>
        </div>
        <div class="flex justify-between gap-1.5 mt-2">${dots}</div>
      </div>
    </div>`;
  }).join('');
  lucide.createIcons();
}

function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

/* ---------- Actions ---------- */
document.getElementById('addForm').addEventListener('submit', async e => {
  e.preventDefault();
  const name = document.getElementById('habitName').value.trim();
  const color = document.getElementById('habitColor').value;
  if (!name) return;
  await add('habits', { name, color });
  document.getElementById('habitName').value = '';
  await refresh();
});

window.deleteHabit = async id => {
  if (!confirm('Delete this habit and all its logs?')) return;
  await del('habits', id);
  // Remove related logs
  const related = logs.filter(l => l.habitId === id);
  for (const l of related) await del('logs', l.id);
  await refresh();
};

// Toggle a day via event delegation
document.getElementById('habitsList').addEventListener('click', async e => {
  const btn = e.target.closest('button[data-habit]');
  if (!btn) return;
  const habitId = +btn.dataset.habit;
  const date = btn.dataset.date;
  const existing = await getLog(habitId, date);
  if (existing) await del('logs', existing.id);
  else await add('logs', { habitId, date });
  await refresh();
});

async function refresh() {
  habits = await all('habits');
  logs = await all('logs');
  render();
}

/* ---------- Theme ---------- */
document.getElementById('themeToggle').addEventListener('change', e => {
  document.documentElement.dataset.theme = e.target.checked ? 'dark' : 'light';
});

/* ---------- Init ---------- */
(async () => {
  await openDB();
  await refresh();
})();
</script>
</body>
</html>
